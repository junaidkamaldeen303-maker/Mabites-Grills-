<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mabite · Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-utensils"></i></div>
                <div class="logo-text">Mabite<span>.</span></div>
            </div>
            <p class="login-subtitle">Sign in to manage your orders</p>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText">Invalid email or password</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="admin@mabites.com" autocomplete="email" required
                        autofocus>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-arrow-right"></i> Sign in
                </button>
            </form>

            <div class="footer-text">
                <i class="fas fa-shield-alt"></i> Secure JWT authentication
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            console.log('🔐 login.html loaded');

            // ===== PASSWORD TOGGLE =====
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });

            // ===== LOGIN FORM =====
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                errorMessage.classList.remove('show');

                if (!email || !password) {
                    errorText.textContent = 'Please enter both email and password';
                    errorMessage.classList.add('show');
                    return;
                }

                // Show loading state
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

                try {
                    console.log('🔐 Attempting login for:', email);

                   // ============================================
// API URL - Production Ready
// ============================================

const API_URL = (() => {
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return 'http://localhost:3000/api';
    }
    return 'https://mabites-grills-mkv8.onrender.com/api';
})();

// Then in your login function, change:
// FROM:
// const response = await fetch('http://localhost:3000/api/auth/login', {

// TO:
const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({ email, password }),
                    });

                    console.log('📡 Response status:', response.status);

                    const result = await response.json();
                    console.log('📦 Login response:', result);

                    if (result.success) {
                        console.log('✅ Login successful!');
                        sessionStorage.setItem('mabite_user', JSON.stringify(result.data.user));

                        if (result.data.user.role === 'admin' || result.data.user.role === 'manager') {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'kitchen.html';
                        }
                    } else {
                        errorText.textContent = result.message || 'Invalid credentials';
                        errorMessage.classList.add('show');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign in';
                    }
                } catch (error) {
                    console.error('❌ Login error:', error);
                    console.error('❌ Error details:', {
                        name: error.name,
                        message: error.message,
                        stack: error.stack
                    });

                    // Show specific error messages
                    let userMessage = 'Network error. Please check your connection.';
                    if (error.message === 'Failed to fetch') {
                        userMessage = '❌ Cannot connect to server. Make sure the backend is running on http://localhost:3000';
                    } else if (error.message.includes('ECONNREFUSED')) {
                        userMessage = '❌ Server is not running. Please start the backend server.';
                    } else if (error.message.includes('CORS')) {
                        userMessage = '❌ CORS error. Check server configuration.';
                    }

                    errorText.textContent = userMessage;
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign in';
                }
            });

            // ===== ENTER KEY SUPPORT =====
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    if (document.activeElement === emailInput || document.activeElement === passwordInput) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });

        })();
    </script>
</body>

</html>
